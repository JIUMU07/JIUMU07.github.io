<style>
    /* 鼠标悬停封面图预览 */
    .cover-preview {
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        width: 200px;
        height: 267px;
        border-radius: 12px;
        overflow: hidden;
        opacity: 0;
        transform: scale(0.85) translateY(8px);
        transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1),
            transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25),
            0 4px 12px rgba(0, 0, 0, 0.15);
        border: 2px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(4px);
    }

    .cover-preview.visible {
        opacity: 1;
        transform: scale(1) translateY(0);
    }

    .cover-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* 暗色模式下调整边框和阴影 */
    :root[data-theme="dark"] .cover-preview {
        border-color: rgba(255, 255, 255, 0.1);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5),
            0 4px 12px rgba(0, 0, 0, 0.35);
    }

    /* 手机端不显示预览图 */
    @media (max-width: 768px) {
        .cover-preview {
            display: none !important;
        }
    }

    /* Chroma 语法高亮：URL 的冒号在 powershell/bash 代码块里会被标成 err（红底块），
       中文博客不需要这种“报错”底色，统一还原为普通文字 */
    .chroma .err,
    :root[data-theme="dark"] .chroma .err {
        color: inherit !important;
        background: none !important;
    }

    /* 上一篇/下一篇：只剩一个时铺满整行，避免右半边空白且点不到；
       同时加上下留白，避免文字贴着卡片边缘显得拥挤 */
    .paginav a:only-child {
        width: 100%;
        box-sizing: border-box;
    }
    .paginav a {
        display: block;
        box-sizing: border-box;
        padding: 14px 18px;
        line-height: 1.6;
    }
    .paginav a br {
        display: none;
    }
    .paginav .title {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
    }

</style>

<link rel="manifest" href="/manifest.webmanifest">

<style id="layout-polish">
/* ===== 正文排版 ===== */
.post-content{font-size:17px;line-height:1.85;letter-spacing:.01em}
.post-content p{margin:0 0 1.15em}
.post-content h1{font-size:30px;margin:34px 0 18px}
.post-content h2{font-size:26px;margin:40px 0 18px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.post-content h3{font-size:21px;margin:30px 0 14px}
.post-content h4{font-size:18px;margin:24px 0 12px}
.post-content ul,.post-content ol{padding-inline-start:1.4em;margin:0 0 1.15em}
.post-content li{margin:.45em 0}
.post-content a{color:var(--primary);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;text-decoration-color:var(--tertiary);box-shadow:none}
.post-content a:hover{text-decoration-color:var(--primary)}
.post-content img{border-radius:10px;margin:1.2em auto;display:block;max-width:100%;height:auto}
.post-content figure{margin:1.4em 0}
.post-content figcaption{font-size:13px;color:var(--secondary);text-align:center;margin-top:8px}
.post-content blockquote{margin:1.4em 0;padding:12px 18px;border-left:3px solid var(--primary);background:var(--code-bg);border-radius:0 8px 8px 0;color:var(--secondary)}
.post-content blockquote p:last-child{margin-bottom:0}
.post-content code{font-size:.9em;padding:2px 6px;border-radius:6px;background:var(--code-bg)}
.post-content pre{padding:18px;border-radius:10px;font-size:13.5px;line-height:1.7;overflow:auto}
.post-content pre code{padding:0;background:none}
.post-content table{width:100%;border-collapse:collapse;font-size:15px;margin:1.4em 0}
.post-content th,.post-content td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;overflow-wrap:anywhere}
.post-content th{background:var(--code-bg);font-weight:600}
.post-content tr:nth-child(even) td{background:var(--code-bg)}
.post-content hr{margin:2.2em 0;border:none;border-top:1px solid var(--border)}

/* ===== 主题色 / 宽度对齐 ===== */
:root{--accent:#3d5a80;--accent-soft:#e8eef6;--accent-strong:#2b4260}
:root[data-theme="dark"]{--accent:#a9c1de;--accent-soft:#27313e;--accent-strong:#cfdff0}
/* 文章页：导航收窄到和正文同宽；首页：导航与「内容+侧栏」同宽 */
body:not(.home-profile){--nav-width:720px}
body.home-profile .main{max-width:min(calc(1024px + var(--gap) * 2),100vw)}

/* ===== 首页 hero ===== */
.home-hero{display:flex;align-items:center;gap:18px;margin:34px 0 26px}
.hero-avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.06);flex:none}
.hero-name{font-size:26px;margin:0 0 6px;line-height:1.3}
.hero-desc{margin:0 0 10px;color:var(--secondary);font-size:15px;line-height:1.7}
.hero-links{display:flex;gap:14px;font-size:13px}
.hero-links a{color:var(--accent);text-decoration:none}
.hero-links a:hover{text-decoration:underline;text-underline-offset:3px}

/* ===== 首页两栏 ===== */
.home-layout{display:grid;grid-template-columns:minmax(0,1fr) 264px;gap:40px;align-items:start}
.home-main{min-width:0}
.home-sidebar{display:flex;flex-direction:column;gap:16px;position:sticky;top:84px}
.side-card{background:var(--entry);border:1px solid var(--border);border-radius:12px;padding:16px}
.side-profile{text-align:center}
.side-avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;margin:0 auto 8px;display:block}
.side-name{font-weight:600;font-size:16px}
.side-bio{font-size:12.5px;color:var(--secondary);line-height:1.7;margin:6px 0 10px}
.side-links{display:flex;justify-content:center;gap:12px;font-size:12.5px}
.side-links a{color:var(--accent);text-decoration:none}
.side-title{font-size:13px;margin:0 0 10px;color:var(--secondary);font-weight:600;letter-spacing:.04em}
.side-tags{display:flex;flex-wrap:wrap;gap:6px}
.side-tags a{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);text-decoration:none}
.side-tags a:hover{color:var(--accent-strong)}
.side-tags a span{opacity:.55;margin-left:4px;font-size:11px}
.side-posts{list-style:none;margin:0;padding:0}
.side-posts li{padding:5px 0;font-size:13px;line-height:1.5}
.side-posts a{color:var(--content);text-decoration:none}
.side-posts a:hover{color:var(--accent)}

/* ===== 卡片细节 ===== */
.entry-badge{position:absolute;top:18px;right:18px;margin:0;font-size:11px;font-weight:500;color:#fff;background:var(--accent);border-radius:999px;padding:2px 8px}
.post-entry:has(.entry-badge) .entry-header h2{padding-right:64px}
.entry-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.entry-tags .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px}
.entry-content p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entry-footer{color:#6c6c6c}
:root[data-theme="dark"] .entry-footer{color:var(--secondary)}

@media (max-width:1100px){
 body.home-profile{--nav-width:720px}
 body.home-profile .main{max-width:min(calc(720px + var(--gap) * 2),100vw)}
 .home-layout{grid-template-columns:minmax(0,1fr)}
 .home-sidebar{display:none}
}
@media (max-width:700px){
 .home-hero{gap:14px;margin:24px 0 20px}
 .hero-avatar{width:56px;height:56px}
 .hero-name{font-size:22px}
 .hero-links{flex-wrap:wrap;gap:10px}
 .entry-badge{display:none}
 .post-entry:has(.entry-badge) .entry-header h2{padding-right:0}
}

/* ===== 列表卡片 ===== */
.post-entry{padding:22px 24px;border-radius:12px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.post-entry:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.08);border-color:var(--tertiary)}
.entry-header h2{font-size:21px;line-height:1.45}
.entry-content{font-size:14.5px;line-height:1.7;margin:10px 0 12px}
.entry-footer{font-size:12.5px}
.first-entry{min-height:220px}
.first-entry .entry-header h1{font-size:30px}
.post-title{font-size:34px;line-height:1.35}

@media (max-width:700px){
 .post-content{font-size:16px;line-height:1.8}
 .post-title{font-size:26px}
 .post-content h2{font-size:22px}
 .post-content h3{font-size:19px}
 .post-entry{padding:18px}
}
</style>

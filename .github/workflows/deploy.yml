name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      # 用 --gc --minify 而不是 -D：-D 会把草稿一起发布到生产站点
      - run: hugo --gc --minify

      - name: 同步到服务器
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: public/
          remote_path: /opt/novelsite/blog/public/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: root
          remote_key: ${{ secrets.SSH_KEY }}

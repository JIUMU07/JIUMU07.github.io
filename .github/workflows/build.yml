name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      # 用 --gc --cleanDestinationDir --minify 而不是 -D：-D 会把草稿一起发布
      - run: hugo --gc --cleanDestinationDir --minify

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Pagefind 索引必须基于构建产物生成；直接用 npx pagefind --site public
      # 会跳过中文预处理，导致中文关键词搜不到（pagefind issue #987）
      - name: Pagefind 索引
        run: npm run search
